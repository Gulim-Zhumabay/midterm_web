    <main class="container py-5">
        <h1 class="page-title text-center">Create an account</h1>
        <p class="page-description text-center">Join BookVerse to save your reading list and get news about new books.</p>

        <section class="content-card register-box mx-auto">
            <form id="register-form" novalidate>
                <div class="mb-3">
                    <label for="reg-name" class="form-label">Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="Your name" autocomplete="name">
                    <div class="invalid-feedback"></div>
                    <div class="valid-feedback">Looks good!</div>
                </div>
                <div class="mb-3">
                    <label for="reg-email" class="form-label">Email</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="name@gmail.com" autocomplete="email">
                    <div class="invalid-feedback"></div>
                    <div class="valid-feedback">Email looks good!</div>
                </div>
                <div class="mb-3">
                    <label for="reg-password" class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="At least 8 characters" autocomplete="new-password">
                    <div class="invalid-feedback"></div>
                    <div class="progress mt-2" style="height: 8px;">
                        <div id="strength-bar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                    </div>
                    <small id="strength-text" class="text-secondary">Password strength: not set</small>
                </div>
                <div class="mb-3">
                    <label for="reg-confirm" class="form-label">Confirm password</label>
                    <input type="password" id="reg-confirm" class="form-control" placeholder="Repeat the password" autocomplete="new-password">
                    <div class="invalid-feedback"></div>
                    <div class="valid-feedback">Passwords match!</div>
                </div>
                <button type="submit" class="btn book-button">Register</button>
            </form>
            <div id="register-result" class="mt-3"></div>
        </section>
