    <main class="container py-5">
    <h1 class="page-title text-center">Sign in</h1>
    <p class="page-description text-center">Welcome back! Enter your email and password.</p>

    <section class="content-card register-box mx-auto">
        <form id="signin-form" novalidate>
            <div class="mb-3">
                <label for="in-email" class="form-label">Email</label>
                <input type="email" id="in-email" class="form-control" placeholder="name@gmail.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="in-password" class="form-label">Password</label>
                <input type="password" id="in-password" class="form-control" autocomplete="current-password">
            </div>
            <button type="submit" class="btn book-button">Sign in</button>
        </form>
        <div id="signin-result" class="mt-3"></div>
            <p class="mt-3 mb-0">No account yet? <a href="register.html">Sign up</a></p>
        </section>
